<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <title>LCOYLE4 // Systems Core V3</title>
    <style>
        body { 
            margin: 0; 
            background-color: #010401; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            color: #00ff33;
        }
        
        .emscripten {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
            z-index: 1;
        }

        #canvas:focus {
          outline: none;
        }

        /* Loading Screen overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #020802;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }

        .crt-scanlines {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 20;
            pointer-events: none;
        }

        .loader-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 50, 0.7);
            animation: pulse 1.5s infinite;
        }

        .loader-spinner {
            border: 4px solid rgba(0, 255, 50, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ff33;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 50, 0.3);
        }

        #status-text {
            font-size: 14px;
            color: #00aa22;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
  </head>
  <body>
    <div class="crt-scanlines"></div>
    
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-title">LCOYLE4 SYSTEMS CORE BOOTING...</div>
        <div id="status-text">Downloading WebAssembly modules (0%)...</div>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var statusElement = document.getElementById('status-text');
      var loaderElement = document.getElementById('loader');

      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
            return function(text) {
                text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            };
        })(),
        printErr: function(text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            console.error(text);
        },
        canvas: (function() {
            var canvas = document.getElementById('canvas');
            return canvas;
        })(),
        setStatus: function(text) {
            if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
            if (text === Module.setStatus.last.text) return;
            var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
            var now = Date.now();
            if (m && now - Module.setStatus.last.time < 30) return; // limit updates
            Module.setStatus.last.time = now;
            Module.setStatus.last.text = text;
            if (m) {
                text = m[1] + '(' + m[2] + '/' + m[4] + ' B)';
            }
            statusElement.innerHTML = text;
            if (text === '') {
                // Done loading, hide loader
                loaderElement.style.opacity = '0';
                setTimeout(function() {
                    loaderElement.style.display = 'none';
                }, 500);
            }
        },
        monitorRunDependencies: function(left) {
            // no dependencies to track
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
