name: Build Portfolio WASM

on:
  push:
    branches: [master]
    paths:
      - 'src/main.cpp'
      - 'src/shell.html'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.60-${{ runner.os }}

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.60
          actions-cache-folder: emsdk

      - name: Build WASM
        run: |
          em++ -Os src/main.cpp \
            imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_demo.cpp \
            imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
            imgui/backends/imgui_impl_sdl2.cpp \
            imgui/backends/imgui_impl_opengl3.cpp \
            -Iimgui -Iimgui/backends \
            -s USE_SDL=2 -s USE_WEBGL2=1 -s MAX_WEBGL_VERSION=2 \
            -s WASM=1 -s ALLOW_MEMORY_GROWTH=1 \
            -s DISABLE_EXCEPTION_CATCHING=1 -s NO_EXIT_RUNTIME=0 \
            -s ASSERTIONS=0 -s NO_FILESYSTEM=1 \
            -DIMGUI_DISABLE_FILE_FUNCTIONS \
            -DIMGUI_IMPL_OPENGL_ES3 \
            -DIMGUI_USE_32BIT_VERTICES \
            --shell-file src/shell.html \
            -o index.html

      - name: Commit built WASM back to master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html index.js index.wasm
          git diff --cached --quiet && echo "No WASM changes" || \
            git commit -m "CI: rebuild portfolio WASM" && git push
